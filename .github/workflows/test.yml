name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: all
          - os: windows-latest
            package: windows
          - os: macos-14
            package: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install . build "setuptools>=77,<83"
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/ui.test.cjs
      - run: python scripts/package.py --platform ${{ matrix.package }} --output package-output
      - uses: actions/upload-artifact@v4
        with:
          name: source-portable-${{ matrix.os }}
          path: package-output/*
