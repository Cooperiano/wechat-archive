<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeChatArchive · 本地归档</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<header><h1>WeChatArchive</h1><span id="status" role="status">正在读取归档…</span></header>
<div id="error" role="alert" hidden></div>
<main><aside><label>搜索会话<input id="rooms-search" placeholder="会话名称"></label><label>会话类型<select id="kind"><option value="">全部</option><option value="group">群聊</option><option value="private">私聊</option><option value="service">服务号</option><option value="system">系统</option><option value="unmapped">未映射</option></select></label><div id="rooms"></div><div class="pager"><button id="rooms-prev">上一页</button><span id="rooms-page"></span><button id="rooms-next">下一页</button></div></aside>
<section><h2 id="title">请选择会话</h2><form id="filters"><label>搜索消息<input id="q" placeholder="正文或发送者"></label><label>开始日期<input id="from" type="date"></label><label>结束日期<input id="to" type="date"></label><label>消息类型<select id="type"><option value="">全部</option><option value="1">文本</option><option value="3">图片</option><option value="34">语音</option><option value="43">视频</option><option value="49">分享卡片</option><option value="10000">系统消息</option></select></label><button>查询</button></form><p class="hint">时间：Asia/Shanghai。每页 100 条；媒体记录保留，媒体本体尚未解码。</p><div id="messages"></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section></main></body></html>
