[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-archive-local"
version = "0.2.0"
description = "Local WeChat 4 archive for Windows and macOS"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Julian Cooper"}]
dependencies = ["zstandard==0.25.0", "tzdata==2025.2"]

[project.optional-dependencies]
mac-key = ["frida==17.23.3; sys_platform == 'darwin'"]

[project.scripts]
wechat-archive = "wechat_archive.cli:main"

[tool.setuptools.packages.find]
include = ["wechat_archive*"]

[tool.setuptools.package-data]
wechat_archive = ["web/*", "vendor/*.js"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt"]
